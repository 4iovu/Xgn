<div class="xgn-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Xgn</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <div id="xgn_current_theme" class="xgn-current-theme"></div>

            <div class="xgn-block">
                <label for="xgn_theme_search">搜索美化</label>
                <input type="text" id="xgn_theme_search" class="text_pole" placeholder="输入美化名称进行搜索并绑定">
                <div id="xgn_search_results" class="xgn-search-results"></div>
            </div>

            <div class="xgn-block">
                <label>已绑定的美化</label>
                <div id="xgn_bound_list" class="xgn-bound-list"></div>
            </div>

        </div>
    </div>
</div>
